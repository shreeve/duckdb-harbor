# Pure workspace: the extension retired (PLAN.md D5); everything lives in
# crates/. Spikes are standalone throwaways, outside the workspace.
[workspace]
members = ["crates/*"]
default-members = ["crates/harbor-protocol", "crates/pilot", "crates/harbor"]
exclude = ["spikes"]
resolver = "2"

[profile.release]
lto = true
strip = true
