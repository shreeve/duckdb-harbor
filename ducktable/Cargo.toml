[workspace]
resolver = "2"
members = ["crates/ducktable", "crates/duckdb-lang", "crates/harbor-client"]

[workspace.package]
version = "2.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/shreeve/duckdb-harbor"

[workspace.dependencies]
# One dependency for GPUI and its component library. The kit pins an exact
# gpui-pre snapshot of Zed's GPUI, and the patched crates below are its exact
# versions, so the kit is pinned exactly too.
gpui-kit = { version = "=0.8.0", features = ["tree-sitter"] }
anyhow = "1"

[profile.dev]
debug = "limited"

[profile.release]
lto = "thin"
strip = true

# The kit's crates come from shreeve/gpui-kit, a fork of longbridge/gpui-kit
# shared by every app built on it. Its patched/0.8.0 branch is Longbridge's
# main plus general-purpose changes not yet upstream, one commit each and each
# a candidate for upstream, tagged v0.8.0-patched.N. DuckTable relies on one
# of them: the host-styled line-number gutter. The rev is the commit tagged
# v0.8.0-patched.1. Moving to a later tag, or to the next release line's
# patched branch, means pinning that tag's commit here with the matching
# gpui-kit version.
# Every crate of the kit comes from the one rev, so they resolve together:
# from a git source, a crate takes its siblings from that source too.
[patch.crates-io]
gpui-kit = { git = "https://github.com/shreeve/gpui-kit", rev = "c7c1596c98364bc1401b87c2fbaf39557a51a89f" }
gpui-base = { git = "https://github.com/shreeve/gpui-kit", rev = "c7c1596c98364bc1401b87c2fbaf39557a51a89f" }
gpui-component = { git = "https://github.com/shreeve/gpui-kit", rev = "c7c1596c98364bc1401b87c2fbaf39557a51a89f" }
gpui-component-macros = { git = "https://github.com/shreeve/gpui-kit", rev = "c7c1596c98364bc1401b87c2fbaf39557a51a89f" }
gpui-kit-assets = { git = "https://github.com/shreeve/gpui-kit", rev = "c7c1596c98364bc1401b87c2fbaf39557a51a89f" }
