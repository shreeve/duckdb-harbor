[workspace]
resolver = "2"
members = ["crates/ducktable", "crates/duckdb-lang", "crates/harbor-client"]
# The vendored patch sources are not members, so each builds and tests on
# its own (cd vendor/gpui-base && cargo test --lib).
exclude = ["vendor/gpui-base", "vendor/gpui-component"]

[workspace.package]
version = "0.22.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/shreeve/duckdb-harbor"

[workspace.dependencies]
# One dependency for GPUI and its component library. The kit pins an exact
# gpui-pre snapshot of Zed's GPUI, and the vendored crates below are its
# exact versions, so the kit is pinned exactly too.
gpui-kit = { version = "=0.7.0", features = ["tree-sitter"] }
anyhow = "1"

[profile.dev]
debug = "limited"

[profile.release]
lto = "thin"
strip = true

# The seams where a pinned widget fights us. vendor/gpui-base and
# vendor/gpui-component are the crates.io 0.7.0 sources gpui-kit 0.7.0
# depends on, with surgical patches, each site marked "DuckTable patch:":
#
# - gpui-base input: the Query editor's line-number rail — host-imposed
#   width and number size, per-row labels, the send mark, statement
#   hairlines — and the helpers that size the Structure view's DDL card
#   to its wrapped content (prewrap, wrapped_line_count), plus
#   set_line_number_visible for an observer with no Window.
# - gpui-base resizable: ResizablePanel::fixed, furniture that keeps its
#   width when the window resizes.
# - gpui-component input: Editor takes a size, as Textarea does, so the
#   Query editor can sit flush with no vertical insets.
# - gpui-component table: a ⌘- or ⇧-click leaves the grid's own
#   multi-row selection alone, and no fixed-region edge line.
#
# Cargo's [patch] replaces a whole crate, so each patched crate is vendored
# whole; GPUI itself (gpui-pre) comes from crates.io untouched. Upgrading the
# pin means copying the new crates.io sources in and re-carrying those marks.
# gpui-base's own tests run in place (cd vendor/gpui-base && cargo test
# --lib); gpui-component's read files outside the published package, so run
# them in an upstream checkout with the patched files copied in.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
