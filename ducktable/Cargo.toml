[workspace]
resolver = "2"
members = ["crates/ducktable", "crates/duckdb-lang", "crates/harbor-client"]

[workspace.package]
version = "0.22.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/shreeve/duckdb-harbor"

[workspace.dependencies]
# One dependency for GPUI and its component library. The kit pins an exact
# gpui-pre snapshot of Zed's GPUI, and the patched crates below are its exact
# versions, so the kit is pinned exactly too.
gpui-kit = { version = "=0.7.0", features = ["tree-sitter"] }
anyhow = "1"

[profile.dev]
debug = "limited"

[profile.release]
lto = "thin"
strip = true

# The kit's crates come from shreeve/gpui-kit, a fork of longbridge/gpui-kit
# shared by every app built on it. Its patched/0.7 branch is the v0.7.0
# release plus general-purpose changes, one commit each and each a candidate
# for upstream, tagged v0.7.0-patched.N. DuckTable relies on fixed resizable
# panels, a sizable Editor, DataTable's select_on_modifier_click and
# fixed_cols_border, the set_line_number guard, EditorState::wrap_row_count
# and prewrap, and the host-styled line-number gutter. The rev is the commit
# tagged v0.7.0-patched.1. Moving to a later tag, or to the next release
# line's patched branch, means pinning that tag's commit here with the
# matching gpui-kit version.
# Every crate of the kit comes from the one rev, so they resolve together:
# from a git source, a crate takes its siblings from that source too.
[patch.crates-io]
gpui-kit = { git = "https://github.com/shreeve/gpui-kit", rev = "cb2f26f2bbd123eeec4a9441fc3449d3341b428a" }
gpui-base = { git = "https://github.com/shreeve/gpui-kit", rev = "cb2f26f2bbd123eeec4a9441fc3449d3341b428a" }
gpui-component = { git = "https://github.com/shreeve/gpui-kit", rev = "cb2f26f2bbd123eeec4a9441fc3449d3341b428a" }
gpui-component-macros = { git = "https://github.com/shreeve/gpui-kit", rev = "cb2f26f2bbd123eeec4a9441fc3449d3341b428a" }
gpui-kit-assets = { git = "https://github.com/shreeve/gpui-kit", rev = "cb2f26f2bbd123eeec4a9441fc3449d3341b428a" }
