# Deliberately NOT on the workspace version: this crate is meant to be
# published standalone as the first tree-sitter-duckdb grammar (see
# docs/QUERY.md), so it carries its own version, edition, and description.
[package]
name = "duckdb-lang"
version = "0.1.0"
edition = "2024"
description = "tree-sitter-duckdb: a tree-sitter grammar derived from DuckDB's PEG grammar"
license = "MIT"

[dependencies]
# The same tree-sitter the app's highlighter runs (via gpui-component);
# the vendored parser.c is generated by the matching CLI version.
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.25.10"

[build-dependencies]
cc = "1"
