[package]
name = "ducktable"
description = "A fast, minimal desktop client for DuckDB, speaking to DuckDB Harbor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
harbor-client = { path = "../harbor-client" }
duckdb-lang = { path = "../duckdb-lang" }
wire = { path = "../../../harbor/crates/wire" }
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
async-channel = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
# The updater talks to the embedded Sparkle framework through objc2 (the
# generation gpui itself uses) and loads it with dlopen.
objc2 = "0.6"
block2 = "0.6"
libc = "0.2"
