[package]
name = "harbor-common"
version.workspace = true
repository.workspace = true
edition = "2024"
description = "harbor-common — what harbor, pilot and ducktable all need: paths, names, permissions, config, lifetimes, states"
license = "MIT"

# No DuckDB, no HTTP, no process spawning, and nothing that shells out. Both
# binaries depend on this crate, so anything that lands here lands in the
# server too — including in the process holding an exclusive write lock on a
# database. Keep it to files, strings, and formatting.
[features]
# The terminal renderer. On by default, for harbor and pilot. A GUI takes
# `default-features = false` and skips it along with unicode-width — it wants
# the semantics (see `state::Level`), not the ANSI.
default = ["term"]
term = ["dep:unicode-width"]
# The config reader that only DuckTable consumes since harbor 0.20 deleted
# its fleet layer (the fleet module itself retired when DuckTable moved to
# socket discovery). Off by default so harbor's build graph
# carries no toml/serde stack for modules it never calls. (state stays
# unconditional: pure semantics, no deps, and ui's Tone conversion needs it.)
config = ["dep:serde", "dep:toml", "dep:serde_json"]
# The membership writer: attach/detach editing the [connection.*] sections of
# config.toml, format-preserving via toml_edit's DOM. harbor enables this (it
# owns the CLI verbs); it is separate from `config` so a pure reader need not
# link the editor, and a GUI that wants neither takes default-features = false.
membership = ["dep:toml_edit"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
toml = { version = "1.1.4", optional = true }
# format-preserving TOML edits (comments and ordering survive) for membership
toml_edit = { version = "0.22", optional = true }
# the berth sidecar is a shared format: harbor writes it, pilot and DuckTable read it
serde_json = { version = "1", optional = true }
# terminal-cell widths: a path with CJK or an emoji in it must not shear a
# table, and counting bytes (or even chars) is exactly how that happens.
unicode-width = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "harbor_common"
path = "src/lib.rs"
