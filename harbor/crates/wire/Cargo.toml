[package]
name = "wire"
version.workspace = true
repository.workspace = true
edition = "2024"
description = "The Harbor wire contract: request shapes, NDJSON envelope, error codes"
license = "MIT"

# Pilot's Harbor protocol types. Harbor implements its
# encoder and request parser directly, so cross-side tests—not a shared Rust
# dependency—pin compatibility. No I/O here, ever: types and codes only.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
