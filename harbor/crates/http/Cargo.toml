[package]
name = "harbor-http"
version.workspace = true
repository.workspace = true
edition = "2024"
description = "The client side of Harbor's HTTP, shared by the harbor CLI and DuckTable"
license = "MIT"

# Blocking HTTP/1.1 over unix sockets and TCP, one request per connection:
# both clients send one request at a time, so an async stack buys nothing.
[dependencies]
wire = { path = "../wire" }
harbor-common = { path = "../common", default-features = false }
serde = "1"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
