[package]
name = "spike-linked2"
version = "0.0.0"
edition = "2021"
publish = false

# Phase 0 spike #1, second half (PLAN.md): does the SAME duckdb-rs crate the
# 1.5.5-bundled spike used also drive a 2.0-dev libduckdb, linked via
# DUCKDB_LIB_DIR/DUCKDB_INCLUDE_DIR? The extension's version pin came from the
# loadable-extension pointer band; a standalone binary uses the plain C API,
# which should hold across the 1.5.5 → 2.0 line. This spike is the proof.
#
# Build:
#   DUCKDB_LIB_DIR=$HOME/Data/Code/duckdb/build/release/src \
#   DUCKDB_INCLUDE_DIR=$HOME/Data/Code/duckdb/src/include \
#   cargo build --release
[dependencies]
duckdb = { version = "~1.10505.0", default-features = false, features = ["vtab"] }

[[bin]]
name = "spike-linked2"
path = "main.rs"
