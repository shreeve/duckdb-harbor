[package]
name = "spike-bundled"
version = "0.0.0"
edition = "2021"
publish = false

# Phase 0 spike #1 (PLAN.md): does the duckdb crate's `bundled` feature give a
# standalone binary the same library API the extension already uses (Connection,
# typed rows, complex types)? This is the linkage `harbor serve` will ship with.
# Same version pin as the extension (1.10505 = DuckDB 1.5.5).
[dependencies]
duckdb = { version = "~1.10505.0", features = ["bundled"] }

[[bin]]
name = "spike-bundled"
path = "main.rs"
