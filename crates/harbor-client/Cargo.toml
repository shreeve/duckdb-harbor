[package]
name = "harbor-client"
description = "DuckTable's Harbor client: transports, probes, and the NDJSON stream"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wire = { git = "https://github.com/shreeve/duckdb-harbor", rev = "8418541" }
harbor-common = { git = "https://github.com/shreeve/duckdb-harbor", rev = "8418541", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
toml = "1"
