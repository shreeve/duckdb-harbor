[package]
name = "pilot"
version.workspace = true
edition = "2024"
description = "pilot — the Harbor client: a shim over harbor::repl"
license = "MIT"

# The client code moved into the harbor crate (src/repl/); this package
# is the standalone `pilot` binary name over that module. It still never
# loads DuckDB — harbor's engine is dlopen-on-demand, and the client
# paths never ask for it.
[dependencies]
harbor = { path = "../harbor" }

[[bin]]
name = "pilot"
path = "src/main.rs"
