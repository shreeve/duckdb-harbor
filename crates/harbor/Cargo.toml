[package]
name = "harbor"
version = "0.17.0"
edition = "2024"
description = "harbor — DuckDB wearing a server: fleet manager + HTTP/UDS engine"
license = "MIT"

[dependencies]
# Paths, names, the permission gate, the config schema, berth lifetimes and
# states, and the renderer. Shared with pilot so the two cannot drift, and
# with ducktable, which takes it without the `term` feature.
harbor-common = { path = "../common" }
duckdb = { version = "~1.10505.0", default-features = false, features = ["vtab"] }
justhttp = { path = "../justhttp" }
serde = "1"
serde_json = "1"
rand = "0.8"
libc = "0.2"

# Test-only: the route table below is harbor's half of the wire contract, so
# the tests check it against the crate that publishes it.
[dev-dependencies]
wire = { path = "../wire" }
# Test-only: doctor's checks are driven from config literals.
toml = "1.1.4"

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }

# The server engine (pool, leases, cancellation, NDJSON /sql) lives in this
# crate's library beside the CLI in the bin — folded back in once the loadable
# extension that justified a separate harbor-core was retired (PLAN.md D5).
[lib]
name = "harbor"
path = "src/lib.rs"

[[bin]]
name = "harbor"
path = "src/main.rs"
