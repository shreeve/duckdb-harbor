[package]
name = "harbor"
version = "0.10.0"
edition = "2024"
description = "harbor — DuckDB wearing a server: fleet manager + HTTP/UDS engine"
license = "MIT"

[features]
# Dynamic by default: harbor links an external libduckdb (DUCKDB_LIB_DIR /
# DUCKDB_INCLUDE_DIR) and is version-agnostic at runtime — it resolves whichever
# libduckdb.dylib sits beside it. A self-contained static build (crates.io
# `bundled` DuckDB 1.5.5) stays available on demand —
# `cargo build -p harbor --features bundled` — but is no longer the default or
# shipped: its one advantage (no sibling dylib) the dylib-swap model removed.
default = []
bundled = ["harbor-core/bundled"]

[dependencies]
harbor-core = { path = "../harbor-core" }
serde_json = "1"
libc = "0.2"

[[bin]]
name = "harbor"
path = "src/main.rs"
