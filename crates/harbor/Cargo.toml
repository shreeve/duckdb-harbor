[package]
name = "harbor"
version.workspace = true
edition = "2024"
description = "harbor — a DuckDB database, served: one binary, client and server"
license = "MIT"

[dependencies]
# Paths, names, the permission gate, and durations. Shared with ducktable,
# which takes it without the `term` feature.
harbor-common = { path = "../common" }
libloading = "0.8"
justhttp = { path = "../justhttp" }
# preserve_order: --json rows must keep column order, not alphabetize it
serde_json = { version = "1", features = ["preserve_order"] }
# --- the client half (src/repl/) ---------------------------------------------
# Pure protocol client: it never touches DuckDB. HTTP/1.1 over
# UnixStream/TcpStream is hand-rolled because dragging an async stack in
# for one request at a time buys nothing. TLS-free on purpose; remote
# human access goes through SSH, while Caddy serves HTTPS app clients.
wire = { path = "../wire" }
crossterm = "0.29.0"
nu-ansi-term = "0.50.3"
reedline = "0.50.0"
signal-hook = { version = "0.4", default-features = false }
# already in reedline's tree: terminal-cell widths for duckbox alignment
unicode-width = "0.2"
getrandom = "0.2"
libc = "0.2"

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }

# The server engine (pool, leases, cancellation, NDJSON /sql) lives in this
# crate's library beside the CLI in the bin — one crate, nothing else links
# the engine.
[lib]
name = "harbor"
path = "src/lib.rs"

[[bin]]
name = "harbor"
path = "src/main.rs"
