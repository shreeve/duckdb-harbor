[package]
name = "wire"
version = "0.12.0"
edition = "2024"
description = "The Harbor wire contract: request shapes, NDJSON envelope, error codes"
license = "MIT"

# This crate IS the protocol spec in compilable form (PLAN.md D8). harbor
# encodes it, pilot decodes it; drift between server and client is a compile
# error. No I/O here, ever — types and codes only.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
