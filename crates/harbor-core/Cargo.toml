[package]
name = "harbor-core"
version = "0.10.0"
edition = "2024"
description = "The Harbor server engine: pool, leases, cancellation, NDJSON /sql"
license = "MIT"

[features]
# Link modes. `bundled` compiles DuckDB 1.5.5 in via crates.io; without it,
# libduckdb-sys links an external libduckdb via DUCKDB_LIB_DIR /
# DUCKDB_INCLUDE_DIR — that is the 2.0 channel (PLAN.md Phase 0 spike).
# Never build this crate in the same cargo invocation as the root extension
# package: `bundled` and `loadable-extension` cannot feature-unify.
bundled = ["duckdb/bundled"]

[dependencies]
duckdb = { version = "~1.10505.0", default-features = false, features = ["vtab"] }
tiny_http = "0.12"
serde = "1"
serde_json = "1"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
