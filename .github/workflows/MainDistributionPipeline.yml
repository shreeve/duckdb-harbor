#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
# Manual / tag-only while we are iterating: local osx_arm64 builds are
# ~20s (`make release`), so running the full pipeline on every push is
# pure latency. Push a v* tag or hit "Run workflow" when you want binaries.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: harbor
      extra_toolchains: rust;python3
      # Five native targets: linux amd64/arm64, osx amd64/arm64, windows amd64.
      #
      # The three wasm ones cannot work. DuckDB-wasm runs the extension inside
      # a browser tab, and harbor_serve binds a listening TCP socket through
      # tiny_http; a browser sandbox has no inbound socket to bind, so a wasm
      # build would either fail to link or produce a binary that cannot do the
      # one thing it is for.
      #
      # windows_amd64_mingw is dropped as redundant -- windows_amd64 is the
      # MSVC build every Windows user wants, and the mingw variant mainly
      # serves the R/Rtools ecosystem. Worth adding when someone needs it,
      # along with the opt-in targets: linux_amd64_musl (Alpine containers),
      # linux_arm64_musl and windows_arm64.
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw'
