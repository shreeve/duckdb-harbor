#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
# Manual / tag-only while we are iterating: local osx_arm64 builds are
# ~20s (`make release`), so running the full pipeline on every push is
# pure latency. Push a v* tag or hit "Run workflow" when you want binaries.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: harbor
      extra_toolchains: rust;python3
      # Internal tool: two platforms is what we actually deploy on.
      # Add targets back when someone needs them.
      exclude_archs: 'linux_amd64_musl;osx_amd64;windows_amd64;windows_amd64_mingw;linux_arm64;wasm_mvp;wasm_eh;wasm_threads'
