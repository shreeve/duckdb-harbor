#
# Full suite — every suite (make test), including the slow ones the quick
# gate leaves out: roundtrip, asserts, fuzz, hostile, deployment and stress
# (sustained load from many clients). Runs after a merge to main and
# nightly — NOT on pull requests, which get the quick gate (Tests.yml). Kept
# out of the PR event on purpose, so it never shows up as a skipped check on
# a PR.
#
# Same engine as the quick gate (the shared .github/actions/duckdb composite
# action); the suite list lives in test/scripts/check.sh. Its rust-cache,
# saved from main under the key the quick gate shares, is the one every PR
# restores.
#
name: Full suite

on:
  push:
    branches: [main]
  schedule:
    # Odd minute on purpose: the :00 stampede is when shared runners are most
    # starved, enough to fail stress on runner congestion alone. 23:41 UTC
    # dodges both the stampede and the peak.
    - cron: '41 23 * * *'
  workflow_dispatch:

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: harbor

jobs:
  full:
    name: full suite
    runs-on: ubuntu-latest
    env:
      # The libduckdb build by name (`alpha42289`), or `latest` or empty for
      # the channel's current build (see scripts/fetch-duckdb.sh).
      DUCKDB_LIB_BUILD: ${{ vars.DUCKDB_LIB_BUILD }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harbor
          shared-key: harbor-linux
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/duckdb

      - name: All suites
        run: make test
