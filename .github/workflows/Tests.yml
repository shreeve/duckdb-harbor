#
# Quick gate — the sub-minute suite, on every PR (and manual runs). It is the
# only check a pull request shows. The full suite (fuzz, stress, deployment,
# asserts) is a separate workflow, FullSuite.yml, that runs on main and nightly,
# so it never appears here as a skipped check.
#
# The focused suite selection is explicit below; the engine comes from the
# local composite action (.github/actions/duckdb) — libduckdb and the duckdb
# CLI from DuckDB's official nightly channel, the current build of the 2.0
# branch.
#
name: Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: harbor

jobs:
  quick:
    name: quick gate
    runs-on: ubuntu-latest
    env:
      # The libduckdb build by name (`alpha42289`), or `latest` or empty for
      # the channel's current build (see scripts/fetch-duckdb.sh).
      DUCKDB_LIB_BUILD: ${{ vars.DUCKDB_LIB_BUILD }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harbor
      - uses: actions/setup-python@v6
        with:
          # Pinned, not '3.x': the suites run from test/scripts/, so a stdlib
          # name collision there breaks on newer Pythons — pin for reproducibility.
          python-version: '3.12'
      - uses: ./.github/actions/duckdb

      - name: Build the fixture database
        run: test/scripts/fixture.sh sample.duckdb

      - name: Quick suites
        run: make test SUITES="unit lifecycle types spec catalog sessions cancel"

      - name: Server log on failure
        if: failure()
        run: cat /tmp/harbor-check.*/server.log 2>/dev/null || true
