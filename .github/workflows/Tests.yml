#
# The suites that live in this repository, as opposed to the distribution
# pipeline in MainDistributionPipeline.yml, which builds the extension for
# every platform and does not run them.
#
# Split into two jobs on purpose. The fast one gates a pull request: unit
# tests, sqllogictest, and the two HTTP suites that answer in under a minute.
# The slow one — resilience, which kills and restarts the server repeatedly,
# and the load generator — runs on the main branch and on a nightly schedule,
# where a five-minute job is not in anybody's way.
#
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fast:
    name: unit, abi, types, sqllogictest, spec, fuzz
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # The suites read from a fixture database rather than one they build, so
      # the CLI has to be here to create it.
      - name: Install the DuckDB CLI
        run: |
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      - name: Build
        run: make configure && make release

      # A fixture generated here rather than committed: a binary database in
      # git would have to be regenerated on every DuckDB storage bump, and the
      # suites care about the shape of the data, not its provenance.
      - name: Build the fixture database
        run: scripts/fixture.sh sample.duckdb

      - name: Unit tests, ABI stamp, type coverage, sqllogictest, spec and fuzz
        run: SUITES="unit abi types sqllogic spec fuzz" scripts/check.sh

      - name: Server log on failure
        if: failure()
        run: cat /tmp/harbor-check.*/server.log 2>/dev/null || true

  slow:
    name: stress, resilience, load
    # Pull requests get the fast job; this one runs where a slow job is free.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install the DuckDB CLI
        run: |
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      - name: Build
        run: make configure && make release

      - name: Build the fixture database
        run: scripts/fixture.sh sample.duckdb

      - name: Everything except the differential suite
        # differential needs the C++ harbor built alongside; it is not a build
        # dependency of this repository, and check.sh skips it when absent.
        run: SUITES="stress spec fuzz deploy resilience" scripts/check.sh

      - name: Load test
        run: |
          # The server's output goes to a file so a startup failure can be
          # shown. Without it the only symptom is swarm reporting that nothing
          # answered, which says where the failure surfaced and nothing about
          # why. The readiness loop is an if/then rather than `curl && break`:
          # under `set -e` a failing curl in an && list aborts the step, so the
          # first attempt — made before the server has finished opening the
          # database — would end the job.
          cp sample.duckdb /tmp/load.duckdb
          bin/harbor /tmp/load.duckdb --port 9496 --token ci --workers 8 \
              > /tmp/load-server.log 2>&1 &
          up=0
          for _ in $(seq 1 60); do
            if curl -sf -m 2 http://127.0.0.1:9496/health >/dev/null 2>&1; then
              up=1
              break
            fi
            sleep 1
          done
          if [ "$up" != 1 ]; then
            echo "the load-test server never answered; its output was:"
            cat /tmp/load-server.log
            exit 1
          fi
          scripts/swarm.py --port 9496 --token ci --levels 1,4,16 --seconds 10 --write-pct 20

      - name: Server log on failure
        if: failure()
        run: cat /tmp/harbor-check.*/server.log 2>/dev/null || true
