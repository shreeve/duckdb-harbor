#
# Quick gate — the sub-minute suite, on every PR (and manual runs). It is the
# only check a pull request shows. The full suite (fuzz, stress, deployment,
# asserts) is a separate workflow, FullSuite.yml, that runs on main and nightly,
# so it never appears here as a skipped check.
#
# The focused suite selection is explicit below; the engine comes from the
# local composite action (.github/actions/duckdb) — libduckdb and the duckdb
# CLI from DuckDB's official nightly channel, the current build of the 2.0
# branch.
#
name: Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: harbor

jobs:
  quick:
    name: quick gate
    runs-on: ubuntu-latest
    env:
      # The libduckdb build by name (`alpha42289`), or `latest` or empty for
      # the channel's current build (see scripts/fetch-duckdb.sh).
      DUCKDB_LIB_BUILD: ${{ vars.DUCKDB_LIB_BUILD }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harbor
      - uses: actions/setup-python@v6
        with:
          # Pinned, not '3.x': the suites run from test/scripts/, so a stdlib
          # name collision there breaks on newer Pythons — pin for reproducibility.
          python-version: '3.12'
      - uses: ./.github/actions/duckdb

      - name: Build the fixture database
        run: test/scripts/fixture.sh sample.duckdb

      - name: Quick suites
        run: make test SUITES="unit lifecycle types spec catalog sessions cancel"

      - name: Server log on failure
        if: failure()
        run: cat /tmp/harbor-check.*/server.log 2>/dev/null || true

  # Windows has no unix sockets, so the list, spawn-on-use and joining by
  # name all have nothing to read there. This job proves what Windows does
  # instead: a bare `harbor` says so and gives the URL form, `start --port`
  # serves, and a client reaches the server by URL. The engine is fetched the
  # way Release.yml fetches it for the Windows archives.
  windows:
    name: windows
    runs-on: windows-2025
    env:
      DUCKDB_LIB_BUILD: ${{ vars.DUCKDB_LIB_BUILD }}
      DUCKDB_LIB: ${{ github.workspace }}/.duckdb-engine
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harbor

      - name: Fetch DuckDB engine
        run: DEST="$DUCKDB_LIB" DUCKDB_PLATFORM=windows-amd64 scripts/fetch-duckdb.sh

      - name: Build harbor
        run: cargo build -p harbor --release

      - name: The list says what Windows cannot show, and the URL form works
        run: |
          set -euo pipefail
          export HARBOR_LIBDUCKDB="$DUCKDB_LIB/duckdb.dll"
          export HARBOR_HOME="$RUNNER_TEMP/harbor-home"
          harbor=target/release/harbor.exe

          out=$("$harbor")
          echo "$out"
          grep -q "not listed on Windows" <<<"$out"
          ! grep -q "Nothing running" <<<"$out"
          grep -q "harbor http://127.0.0.1:<p>" <<<"$out"

          "$harbor" "$RUNNER_TEMP/w.duckdb" start --port 9495 &
          srv=$!
          for _ in $(seq 1 50); do
            curl -sf http://127.0.0.1:9495/ready >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -sf http://127.0.0.1:9495/ready | grep -q ready

          # With a server up, the list still says so, and does not claim it is running.
          out=$("$harbor")
          echo "$out"
          grep -q "not listed on Windows" <<<"$out"

          "$harbor" http://127.0.0.1:9495 -c "SELECT 42 AS ok" --mode csv | grep -q 42
          kill "$srv"
          echo "windows: the list is honest, start --port serves, the URL form reaches it"
