#
# The repository's own test suites (test/scripts/check.sh), run against the
# shipped build: harbor is dynamically linked (no bundled DuckDB), so CI fetches
# a libduckdb to link against and a duckdb CLI to build fixtures with, then runs
# the make targets. The suite list lives in the Makefile (check_quick / check),
# not here, so it never drifts.
#
# Two jobs: a quick gate on every PR, and the full suite on main and nightly
# (resilience restarts the server repeatedly; a five-minute job is fine there).
#
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # DuckDB release to link against and to build fixtures with. 2.0 is not a
  # published release (only a from-source dev build), so CI uses the newest
  # downloadable stable — which is fine: harbor is version-agnostic (PLAN.md D1,
  # C ABI stable 1.5→2.0), so this validates the code, while local `make check`
  # links the developer's 2.0 build and covers that engine on every change.
  # Bump this the day a newer engine publishes downloadable libduckdb assets.
  DUCKDB_VERSION: v1.5.5

jobs:
  quick:
    name: quick gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # libduckdb (the link target — only the library is needed; the dynamic
      # build uses pregenerated bindings, no headers) and the duckdb CLI (the
      # suites read from a fixture it builds). Both from the same release, so
      # fixture and engine agree. The dir is absolute, so the Makefile's baked
      # rpath resolves libduckdb at runtime with no LD_LIBRARY_PATH.
      - name: Fetch libduckdb + duckdb CLI
        run: |
          set -euo pipefail
          dir="$HOME/duckdb"; mkdir -p "$dir"
          base="https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}"
          curl -fsSL -o /tmp/libduckdb.zip "$base/libduckdb-linux-amd64.zip"
          curl -fsSL -o /tmp/duckdb-cli.zip "$base/duckdb_cli-linux-amd64.zip"
          unzip -oq /tmp/libduckdb.zip -d "$dir"
          unzip -oq /tmp/duckdb-cli.zip -d "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          echo "DUCKDB_LIB=$dir" >> "$GITHUB_ENV"

      - name: Build the fixture database
        run: test/scripts/fixture.sh sample.duckdb

      - name: Quick suites
        run: make check_quick

      - name: Server log on failure
        if: failure()
        run: cat /tmp/harbor-check.*/server.log 2>/dev/null || true

  full:
    name: full suite
    # PRs get the quick gate; the full run is for main and the nightly cron.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch libduckdb + duckdb CLI
        run: |
          set -euo pipefail
          dir="$HOME/duckdb"; mkdir -p "$dir"
          base="https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}"
          curl -fsSL -o /tmp/libduckdb.zip "$base/libduckdb-linux-amd64.zip"
          curl -fsSL -o /tmp/duckdb-cli.zip "$base/duckdb_cli-linux-amd64.zip"
          unzip -oq /tmp/libduckdb.zip -d "$dir"
          unzip -oq /tmp/duckdb-cli.zip -d "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          echo "DUCKDB_LIB=$dir" >> "$GITHUB_ENV"

      - name: Build the fixture database
        run: test/scripts/fixture.sh sample.duckdb

      - name: All suites
        run: make check

      - name: Server log on failure
        if: failure()
        run: cat /tmp/harbor-check.*/server.log 2>/dev/null || true
