#
# Quick gate — the sub-minute suite, on every PR (and manual runs). It is the
# only check a pull request shows. The full suite (fuzz, stress, deployment,
# asserts) is a separate workflow, FullSuite.yml, that runs on main and nightly,
# so it never appears here as a skipped check.
#
# The focused suite selection is explicit below; the engine is fetched by the
# local composite action (.github/actions/duckdb) — DuckDB's official v2 nightly.
#
name: Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quick:
    name: quick gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          # Pinned, not '3.x': the suites run from test/scripts/, so a stdlib
          # name collision there breaks on newer Pythons — pin for reproducibility.
          python-version: '3.12'
      - uses: ./.github/actions/duckdb

      - name: Build the fixture database
        run: test/scripts/fixture.sh sample.duckdb

      - name: Quick suites
        run: make test SUITES="unit fleet types spec catalog sessions cancel"

      - name: Server log on failure
        if: failure()
        run: cat /tmp/harbor-check.*/server.log 2>/dev/null || true
