# Release — push a v* tag and five self-contained archives appear on the
# GitHub Release: osx-arm64, linux-amd64, linux-arm64, windows-amd64, and
# windows-arm64. Each is built on a native runner against DuckDB's official v2
# nightly and smoke-tested as packaged. Unix archives include the matched ui
# extension; Windows archives carry harbor.exe, pilot.exe, and duckdb.dll.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,        plat: osx-arm64,     duck_plat: osx,             rpath: '@loader_path' }
          - { runner: ubuntu-24.04,     plat: linux-amd64,   duck_plat: linux-amd64,     rpath: '$ORIGIN' }
          - { runner: ubuntu-24.04-arm, plat: linux-arm64,   duck_plat: linux-arm64,     rpath: '$ORIGIN' }
          - { runner: windows-2025,     plat: windows-amd64, duck_plat: windows-amd64 }
          - { runner: windows-11-arm,   plat: windows-arm64, duck_plat: windows-arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      DUCKDB_LIB: ${{ github.workspace }}/.duckdb-engine
    steps:
      - uses: actions/checkout@v5

      # The ui source (our fork until duckdb/duckdb-ui#242 lands) and the
      # metadata stamper it vendors. Only that one submodule — not duckdb.
      - uses: actions/checkout@v5
        if: ${{ !startsWith(matrix.plat, 'windows-') }}
        with:
          repository: shreeve/duckdb-ui
          path: duckdb-ui
      - if: ${{ !startsWith(matrix.plat, 'windows-') }}
        run: git -C duckdb-ui submodule update --init extension-ci-tools

      - name: Fetch DuckDB engine (official v2 nightly)
        shell: bash
        run: DEST="$DUCKDB_LIB" DUCKDB_PLATFORM=${{ matrix.duck_plat }} scripts/fetch-duckdb.sh

      # Relative rpath instead of the Makefile's absolute one: the binary
      # looks beside itself and in ../lib, so the archive works anywhere.
      - name: Build harbor + pilot
        if: ${{ !startsWith(matrix.plat, 'windows-') }}
        run: |
          export DUCKDB_LIB_DIR="$DUCKDB_LIB"
          export RUSTFLAGS='-C link-args=-Wl,-rpath,${{ matrix.rpath }} -C link-args=-Wl,-rpath,${{ matrix.rpath }}/../lib'
          cargo build -p harbor -p pilot --release

      - name: Build harbor + pilot (Windows)
        if: ${{ startsWith(matrix.plat, 'windows-') }}
        shell: bash
        run: |
          export DUCKDB_LIB_DIR="$DUCKDB_LIB"
          cargo build -p harbor -p pilot --release

      - name: Build ui extension
        if: ${{ !startsWith(matrix.plat, 'windows-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DUCKDB_UI_DIR="$PWD/duckdb-ui" OUT="$PWD/ui.duckdb_extension" \
            scripts/build-ui-extension.sh

      - name: Package
        if: ${{ !startsWith(matrix.plat, 'windows-') }}
        run: |
          TAG="$GITHUB_REF_NAME" PLAT=${{ matrix.plat }} UI_EXT="$PWD/ui.duckdb_extension" \
            scripts/package-release.sh

      - name: Package (Windows)
        if: ${{ startsWith(matrix.plat, 'windows-') }}
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME" PLAT=${{ matrix.plat }} \
            scripts/package-release.sh

      # Prove the archive as shipped: extract, run harbor from bin/ (exercises
      # the relative rpath -> lib/), query it through pilot, LOAD the ui.
      - name: Smoke-test packaged layout
        if: ${{ !startsWith(matrix.plat, 'windows-') }}
        run: |
          tar -C /tmp -xzf dist/harbor-"$GITHUB_REF_NAME"-${{ matrix.plat }}.tar.gz
          root=/tmp/harbor-"$GITHUB_REF_NAME"-${{ matrix.plat }}
          # The ui extension's init creates ~/.duckdb/extension_data
          # non-recursively; a virgin runner $HOME has no ~/.duckdb yet
          # (install.sh creates it for real users).
          mkdir -p "$HOME/.duckdb"
          # --create: a fresh smoke db is the point here; harbor no longer
          # mints database files implicitly.
          "$root/bin/harbor" add /tmp/smoke.duckdb --create --name smoke --unsigned \
            --init "LOAD '$root/extensions/ui.duckdb_extension';"
          "$root/bin/pilot" smoke -c "SELECT 42 AS ok" --mode csv | grep -q 42
          "$root/bin/harbor" stop smoke
          echo "smoke: rpath, wire round-trip, and ui load all good"

      - name: Smoke-test packaged layout (Windows)
        if: ${{ startsWith(matrix.plat, 'windows-') }}
        shell: bash
        run: |
          archive="dist/harbor-$GITHUB_REF_NAME-${{ matrix.plat }}.zip"
          7z x "$archive" -o"$RUNNER_TEMP" -y >/dev/null
          root="$RUNNER_TEMP/harbor-$GITHUB_REF_NAME-${{ matrix.plat }}"
          export HARBOR_HOME="$RUNNER_TEMP/harbor-home"
          "$root/bin/harbor.exe" add "$RUNNER_TEMP/smoke.duckdb" \
            --create --name smoke --token ''
          "$root/bin/pilot.exe" smoke -c "SELECT 42 AS ok" --mode csv | grep -q 42
          "$root/bin/harbor.exe" stop smoke
          echo "smoke: DLL loading, TCP fleet, and wire round-trip all good"

      - uses: actions/upload-artifact@v7
        with:
          name: harbor-${{ github.ref_name }}-${{ matrix.plat }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum harbor-*.tar.gz harbor-*.zip > "harbor-$GITHUB_REF_NAME-checksums.txt"
          gh release create "$GITHUB_REF_NAME" *.tar.gz *.zip \
            "harbor-$GITHUB_REF_NAME-checksums.txt" \
            --repo "$GITHUB_REPOSITORY" --title "harbor $GITHUB_REF_NAME" \
            --notes "Self-contained harbor + pilot releases, version-locked to \
          one DuckDB v2 nightly. Unix archives include the matched ui extension \
          and install.sh; Windows archives include duckdb.dll beside the binaries. \
          Extract and run in place."
