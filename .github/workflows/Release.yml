# Release — push a v* tag and five self-contained archives appear on the
# GitHub Release: osx-arm64, linux-amd64, linux-arm64, windows-amd64, and
# windows-arm64. Each is built on a native runner against a v2-API DuckDB
# engine and smoke-tested as packaged. Unix archives carry harbor and
# libduckdb; Windows archives carry harbor.exe and duckdb.dll.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# One release run at a time, queued not cancelled: two v* tags pushed close
# together (or a tag deleted and re-pushed with a run still in flight) must
# not race — the last finisher would take --latest even if it's the older
# version, and install.sh resolves /releases/latest.
concurrency:
  group: harbor-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,         plat: osx-arm64,     duck_plat: osx }
          - { runner: ubuntu-24.04,     plat: linux-amd64,   duck_plat: linux-amd64 }
          - { runner: ubuntu-24.04-arm, plat: linux-arm64,   duck_plat: linux-arm64 }
          - { runner: windows-2025,     plat: windows-amd64, duck_plat: windows-amd64 }
          - { runner: windows-11-arm,   plat: windows-arm64, duck_plat: windows-arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: harbor
    env:
      DUCKDB_LIB: ${{ github.workspace }}/.duckdb-engine
    steps:
      - uses: actions/checkout@v5


      - name: Fetch DuckDB engine
        shell: bash
        env:
          # The official channel is frozen pre-v2-C-API until DuckDB 2.0 GA,
          # so fetch from our own shelf instead: the Engine workflow builds
          # all five platforms at CI's pinned commit and shelves them on the
          # engine-<pin> prerelease in this repo, in the official channel's
          # exact zip shape. At GA, delete this env block and fetch-duckdb.sh
          # falls back to artifacts.duckdb.org on its own.
          ENGINE_URL: https://github.com/${{ github.repository }}/releases/download/engine-1582849bf9/duckdb-binaries-${{ matrix.duck_plat }}.zip
        run: DEST="$DUCKDB_LIB" DUCKDB_PLATFORM=${{ matrix.duck_plat }} scripts/fetch-duckdb.sh

      # Fail FAST if the fetched library cannot serve this harbor — grep the
      # v2 symbol names straight out of the binary. With ENGINE_URL above
      # this should always pass; it stays because the failure it prevents
      # (five native runners packaging an engine harbor refuses at dlopen,
      # surfaced late and cryptically by the smoke test) is worth two
      # seconds per run, whatever the engine's provenance.
      - name: Engine can serve this harbor
        shell: bash
        run: |
          # No `ls | head`: a candidate that doesn't exist makes ls exit
          # nonzero, and -e/pipefail would kill the step before any
          # diagnostic prints.
          lib=""
          for f in "$DUCKDB_LIB"/libduckdb.so "$DUCKDB_LIB"/libduckdb.dylib \
                   "$DUCKDB_LIB"/duckdb.dll; do
            if [ -f "$f" ]; then lib=$f; break; fi
          done
          [ -n "$lib" ] || { echo "no libduckdb found in $DUCKDB_LIB"; exit 1; }
          if ! grep -qc duckdb_v2_connect "$lib"; then
            echo "::error::$lib exports no v2 C API symbols — harbor $(grep -m1 '^version' Cargo.toml) cannot serve with it."
            echo "::error::The official artifact channel is frozen pre-v2-API; the 0.21 release is gated on DuckDB 2.0 GA."
            exit 1
          fi

      # Nothing links the engine — harbor dlopens it at runtime (bin/../lib
      # is the first place it looks), so the build needs no rpath and no
      # library at all.
      - name: Build harbor
        shell: bash
        run: cargo build -p harbor --release

      - name: Package
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME" PLAT=${{ matrix.plat }} \
            scripts/package-release.sh

      # Prove the archive as shipped: extract, and open a database straight
      # from bin/ — spawn-on-use exercises the whole thing in one line (the
      # ../lib engine lookup, the server, the wire round-trip), and the
      # refcounted server reaps itself.
      - name: Smoke-test packaged layout
        if: ${{ !startsWith(matrix.plat, 'windows-') }}
        run: |
          tar -C /tmp -xzf dist/harbor-"$GITHUB_REF_NAME"-${{ matrix.plat }}.tar.gz
          root=/tmp/harbor-"$GITHUB_REF_NAME"-${{ matrix.plat }}
          "$root/bin/harbor" /tmp/smoke.duckdb -c "SELECT 42 AS ok" --mode csv | grep -q 42
          echo "smoke: engine lookup and wire round-trip both good"

      - name: Smoke-test packaged layout (Windows)
        if: ${{ startsWith(matrix.plat, 'windows-') }}
        shell: bash
        run: |
          archive="dist/harbor-$GITHUB_REF_NAME-${{ matrix.plat }}.zip"
          7z x "$archive" -o"$RUNNER_TEMP" -y >/dev/null
          root="$RUNNER_TEMP/harbor-$GITHUB_REF_NAME-${{ matrix.plat }}"
          export HARBOR_HOME="$RUNNER_TEMP/harbor-home"
          "$root/bin/harbor.exe" "$RUNNER_TEMP/smoke.duckdb" serve \
            --create --port 9495 --token smoke &
          srv=$!
          for _ in $(seq 1 50); do
            curl -sf http://127.0.0.1:9495/ready >/dev/null 2>&1 && break
            sleep 0.2
          done
          "$root/bin/harbor.exe" http://127.0.0.1:9495 --token smoke \
            -c "SELECT 42 AS ok" --mode csv | grep -q 42
          kill "$srv"
          echo "smoke: DLL loading, TCP serve, and wire round-trip all good"

      - uses: actions/upload-artifact@v7
        with:
          name: harbor-${{ github.ref_name }}-${{ matrix.plat }}
          path: harbor/dist/*

  release:
    needs: build
    # refs/tags/v, not refs/tags/: a workflow_dispatch aimed at a
    # ducktable-v* tag must not mint harbor archives or steal --latest.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum harbor-*.tar.gz harbor-*.zip > "harbor-$GITHUB_REF_NAME-checksums.txt"
          # Create-if-missing, then upload with --clobber: a re-run after a
          # transient asset failure repairs the release instead of dying on
          # "already exists". --latest explicitly: DuckTable releases share
          # this repo under ducktable-v* tags, and install.sh resolves the
          # /releases/latest redirect — that pointer must always be a harbor
          # release.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --title "harbor $GITHUB_REF_NAME" \
              --latest \
              --notes "Self-contained harbor releases, version-locked to one DuckDB v2 nightly. Unix archives carry libduckdb and install.sh; Windows archives carry duckdb.dll beside the binary. Extract and run in place."
          gh release upload "$GITHUB_REF_NAME" *.tar.gz *.zip \
            "harbor-$GITHUB_REF_NAME-checksums.txt" \
            --clobber --repo "$GITHUB_REPOSITORY"
