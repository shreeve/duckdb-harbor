name: Set up DuckDB
description: >
  Put a DuckDB engine where CI can run it: the library harbor dlopens and the
  duckdb CLI of the same build, which builds the test fixture, fetched by the
  script a developer runs (scripts/fetch-duckdb.sh, the one place the sources
  and the archive shapes are spelled). DUCKDB_LIB_BUILD in the job's
  environment picks the build: a name takes both from this repository's
  engine-<build> release, `latest` or empty from DuckDB's nightly channel.
runs:
  using: composite
  steps:
    - name: DuckDB engine and CLI
      shell: bash
      run: |
        set -euo pipefail
        DEST="$HOME/duckdb" "$GITHUB_WORKSPACE/harbor/scripts/fetch-duckdb.sh"
        echo "$HOME/duckdb" >> "$GITHUB_PATH"
        # Nothing links the engine — harbor dlopens it at runtime, and this
        # directory is not on its search path. The env override is the
        # designed door, and it wants the file, not the directory.
        echo "HARBOR_LIBDUCKDB=$HOME/duckdb/libduckdb.so" >> "$GITHUB_ENV"
        "$HOME/duckdb/duckdb" -version
