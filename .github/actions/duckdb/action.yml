name: Set up DuckDB
description: >
  Put a DuckDB engine where CI can run it: the library harbor dlopens and the
  duckdb CLI that builds the test fixture, both from DuckDB's official nightly
  channel, fetched by the same script a developer runs (scripts/fetch-duckdb.sh
  — the one place the channel and the archive shapes are spelled). The channel
  is the latest green build of the 2.0 branch, so the suite runs against
  DuckDB's current main; the script refuses a library that lacks the v2 C API.
runs:
  using: composite
  steps:
    - name: DuckDB engine and CLI (official nightly)
      shell: bash
      run: |
        set -euo pipefail
        DEST="$HOME/duckdb" "$GITHUB_WORKSPACE/harbor/scripts/fetch-duckdb.sh"
        echo "$HOME/duckdb" >> "$GITHUB_PATH"
        # Nothing links the engine — harbor dlopens it at runtime, and this
        # directory is not on its search path. The env override is the
        # designed door, and it wants the file, not the directory.
        echo "HARBOR_LIBDUCKDB=$HOME/duckdb/libduckdb.so" >> "$GITHUB_ENV"
        "$HOME/duckdb/duckdb" -version
